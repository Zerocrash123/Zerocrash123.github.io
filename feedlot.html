<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Feedlot Designer — Río Grande</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: rgba(17, 22, 30, 0.94);
    --panel-solid: #11161e;
    --panel2: #1a212c;
    --line: rgba(255, 255, 255, 0.07);
    --line2: rgba(255, 255, 255, 0.12);
    --text: #f2f6fa;
    --dim: #9aa7b4;
    --muted: #7c8894;
    --green: #43c463;
    --green-hi: #2ea04e;
    --amber: #e8a33d;
    --red: #f2555a;
    --blue: #5ca8ff;
    --ease: cubic-bezier(.32, .72, .3, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; cursor: pointer; transition: transform .1s var(--ease), background .15s, border-color .15s, opacity .15s; }
  button:active { transform: scale(.96); }

  /* ---------- Header ---------- */
  #hdr {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; background: linear-gradient(180deg, #131a24, #0e141d);
    border-bottom: 1px solid var(--line); z-index: 30;
  }
  #hdr .brand { font-weight: 800; font-size: 14px; letter-spacing: .02em; white-space: nowrap; }
  #hdr .brand small { display: block; font-size: 9px; font-weight: 700; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
  #hdr .sp { flex: 1; }
  .hBtn {
    background: var(--panel2); border: 1px solid var(--line2); color: var(--text);
    border-radius: 10px; padding: 7px 11px; font-size: 12.5px; font-weight: 700;
  }
  .hBtn.on { background: var(--green-hi); border-color: var(--green-hi); }

  /* ---------- Layout ---------- */
  #wrap { flex: 1; display: flex; min-height: 0; position: relative; }
  #stage { flex: 1; position: relative; min-width: 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ---------- Panels (sidebar on desktop, sheets on mobile) ---------- */
  .panel {
    background: var(--panel-solid); border-right: 1px solid var(--line);
    width: 252px; flex: none; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 10px 12px 24px; z-index: 40;
  }
  #props { border-right: 0; border-left: 1px solid var(--line); display: none; }
  #props.has { display: block; }
  .panel h2 {
    font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin: 14px 0 7px; border-bottom: 1px solid var(--line); padding-bottom: 4px;
  }
  .panel h2:first-child { margin-top: 2px; }
  .bGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .bGrid.one { grid-template-columns: 1fr; }
  .pBtn {
    background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 8px 6px; font-size: 11.5px; font-weight: 700; text-align: center;
    line-height: 1.25; min-height: 40px;
  }
  .pBtn .em { display: block; font-size: 15px; margin-bottom: 2px; }
  .pBtn.on { background: var(--green-hi); border-color: var(--green-hi); }
  .rowBtns { display: flex; gap: 5px; }
  .rowBtns .pBtn { flex: 1; min-height: 32px; padding: 6px 4px; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--dim); margin-top: 8px; }
  .chk input { width: 17px; height: 17px; accent-color: var(--green); }
  #terrInfo { font-size: 12px; color: var(--dim); font-weight: 600; margin-bottom: 6px; }

  /* Field element list */
  #fieldList { display: flex; flex-direction: column; gap: 4px; }
  .fRow {
    display: flex; align-items: center; gap: 8px; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 9px; padding: 6px 9px; font-size: 12px;
    font-weight: 600; color: var(--text); text-align: left; width: 100%;
  }
  .fRow.sel { border-color: var(--amber); }
  .fRow small { color: var(--muted); font-weight: 600; margin-left: auto; white-space: nowrap; }
  #fEmpty { font-size: 11.5px; color: var(--muted); line-height: 1.5; }

  /* ---------- Props panel ---------- */
  #props .pTitle { font-size: 15px; font-weight: 800; margin-bottom: 2px; display: flex; align-items: center; gap: 7px; }
  #props .pSub { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 10px; }
  .fld { margin-bottom: 10px; }
  .fld label { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .fld input[type=text], .fld input[type=number] {
    width: 100%; background: var(--panel2); border: 1px solid var(--line2); border-radius: 9px;
    color: var(--text); font-size: 15px; font-weight: 700; padding: 8px 10px; font-family: inherit;
    -webkit-user-select: text; user-select: text;
  }
  .fld input[type=range] { width: 100%; accent-color: var(--green); height: 28px; }
  #calcBox {
    background: rgba(67,196,99,.08); border: 1px solid rgba(67,196,99,.25); border-radius: 10px;
    padding: 8px 10px; font-size: 12.5px; font-weight: 700; color: var(--green); line-height: 1.6; margin-bottom: 10px;
  }
  .aBtns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; }
  .aBtn { background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; color: var(--text); padding: 9px 4px; font-size: 12px; font-weight: 700; }
  .aBtn.danger { color: var(--red); border-color: rgba(242,85,90,.4); grid-column: span 2; }

  /* ---------- Overlays on canvas ---------- */
  #chip {
    position: absolute; top: 10px; left: 10px; z-index: 20;
    background: var(--panel); border: 1px solid var(--line2); border-radius: 11px;
    padding: 7px 11px; font-size: 12px; font-weight: 700; pointer-events: none;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); line-height: 1.5;
  }
  #chip b { color: var(--green); }
  #hint {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 20;
    background: rgba(10,14,20,.7); border-radius: 9px; padding: 5px 12px;
    font-size: 10.5px; font-weight: 600; color: var(--dim); white-space: nowrap;
    max-width: 94%; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
  }
  #fabAdd, #fabSheet { display: none; }

  /* ---------- Modals ---------- */
  .ov {
    position: fixed; inset: 0; background: rgba(4,7,11,.62); z-index: 90;
    display: none; align-items: flex-end; justify-content: center;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .ov.show { display: flex; }
  .ov .card {
    background: var(--panel-solid); border: 1px solid var(--line2);
    border-radius: 18px 18px 0 0; width: 100%; max-width: 520px; max-height: 82vh;
    overflow-y: auto; padding: 18px 18px calc(20px + env(safe-area-inset-bottom));
  }
  @media (min-width: 720px) { .ov { align-items: center; } .ov .card { border-radius: 18px; } }
  .card h1 { font-size: 17px; font-weight: 800; margin-bottom: 12px; }
  .card .closeX { float: right; background: var(--panel2); border: 1px solid var(--line2); color: var(--dim); width: 30px; height: 30px; border-radius: 9px; font-size: 14px; }
  .mList { display: flex; flex-direction: column; gap: 7px; clear: both; }
  .mList button { background: var(--panel2); border: 1px solid var(--line); border-radius: 11px; color: var(--text); font-size: 13.5px; font-weight: 700; padding: 12px; text-align: left; }
  .mList button.danger { color: var(--red); }
  table.sum { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.sum th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 5px 4px; border-bottom: 1px solid var(--line2); }
  table.sum td { padding: 6px 4px; border-bottom: 1px solid var(--line); font-weight: 600; }
  table.sum td:nth-child(2), table.sum td:nth-child(3), table.sum th:nth-child(2), table.sum th:nth-child(3) { text-align: right; }
  .bigStats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 14px; }
  .bigStats .bs { background: var(--panel2); border: 1px solid var(--line); border-radius: 11px; padding: 9px 11px; }
  .bigStats .bv { font-size: 19px; font-weight: 800; color: var(--green); }
  .bigStats .bl { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 1px; }
  #err {
    position: fixed; inset: 0; z-index: 200; background: var(--bg); color: var(--amber);
    display: none; align-items: center; justify-content: center; text-align: center;
    padding: 30px; font-size: 14px; font-weight: 700; line-height: 1.6;
  }

  /* ---------- Mobile: panels become sheets ---------- */
  @media (max-width: 919px) {
    .panel {
      position: fixed; left: 0; right: 0; bottom: 0; width: auto; max-height: 62vh;
      border: 1px solid var(--line2); border-bottom: 0; border-radius: 18px 18px 0 0;
      transform: translateY(105%); transition: transform .28s var(--ease); z-index: 60;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      box-shadow: 0 -10px 34px rgba(0,0,0,.5);
    }
    .panel.open { transform: translateY(0); }
    #props.has { display: block; }
    #fabAdd {
      display: flex; position: absolute; left: 12px; bottom: 40px; z-index: 25;
      background: var(--green-hi); color: #fff; border: 0; border-radius: 14px;
      padding: 12px 16px; font-size: 14px; font-weight: 800; align-items: center; gap: 6px;
      box-shadow: 0 6px 18px rgba(0,0,0,.4);
    }
    #hint { bottom: 8px; }
    .panel .sheetClose {
      display: block; position: sticky; top: 0; float: right;
      background: var(--panel2); border: 1px solid var(--line2); color: var(--dim);
      width: 30px; height: 30px; border-radius: 9px; font-size: 14px; z-index: 5;
    }
  }
  @media (min-width: 920px) { .panel .sheetClose { display: none; } }
</style>
</head>
<body>

<div id="err"></div>

<div id="hdr">
  <div class="brand">Feedlot Designer<small>Estancia Río Grande</small></div>
  <div class="sp"></div>
  <button class="hBtn" id="btnView">2D</button>
  <button class="hBtn" id="btnLang">ES</button>
  <button class="hBtn" id="btnMenu">&#8942;</button>
</div>

<div id="wrap">

  <!-- ===== Palette ===== -->
  <aside class="panel" id="side">
    <button class="sheetClose" data-close="side">&#10005;</button>
    <h2 data-i="nav">NAVEGACIÓN</h2>
    <div class="rowBtns">
      <button class="pBtn" id="nOrbit">3D</button>
      <button class="pBtn" id="nTop" data-i="top">Aérea</button>
      <button class="pBtn" id="nCenter" data-i="center">Centrar</button>
    </div>
    <h2 data-i="grid">GRILLA</h2>
    <div class="rowBtns" id="gridBtns">
      <button class="pBtn" data-g="5">5m</button>
      <button class="pBtn on" data-g="10">10m</button>
      <button class="pBtn" data-g="25">25m</button>
      <button class="pBtn" data-g="0" data-i="gOff">Sin</button>
    </div>
    <label class="chk"><input type="checkbox" id="ckSnap" checked><span data-i="snap">Imán 1 m</span></label>
    <h2 data-i="terr">TERRENO</h2>
    <div id="terrInfo">500 × 500 m</div>
    <div class="bGrid one"><button class="pBtn" id="btnTerr" data-i="terrBtn">Definir terreno…</button></div>
    <h2 data-i="addEl">AGREGAR ELEMENTOS</h2>
    <div class="bGrid" id="padd"></div>
    <h2 data-i="nat">ELEMENTOS NATURALES</h2>
    <div class="bGrid" id="pnat"></div>
    <h2 data-i="forr">FORRAJES</h2>
    <div class="bGrid" id="pforr"></div>
    <h2 data-i="inField">ELEMENTOS EN CAMPO</h2>
    <div id="fieldList"></div>
    <div id="fEmpty" data-i="empty">Todavía no hay elementos. Tocá un botón de arriba para agregar.</div>
  </aside>

  <!-- ===== Stage ===== -->
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="chip">—</div>
    <div id="hint">—</div>
    <button id="fabAdd">＋ <span data-i="add">Agregar</span></button>
  </main>

  <!-- ===== Properties ===== -->
  <aside class="panel" id="props">
    <button class="sheetClose" data-close="props">&#10005;</button>
    <div class="pTitle"><span id="prEmoji"></span><span id="prType"></span></div>
    <div class="pSub" id="prSub"></div>
    <div class="fld"><label data-i="propName">Nombre</label><input type="text" id="prName" maxlength="30" autocomplete="off"></div>
    <div class="fld" id="fldW"><label id="lblW"></label><input type="number" id="prW" min="1" max="800" step="1" inputmode="decimal"></div>
    <div class="fld" id="fldD"><label id="lblD"></label><input type="number" id="prD" min="1" max="800" step="1" inputmode="decimal"></div>
    <div class="fld" id="fldN"><label data-i="cant">Cantidad</label><input type="number" id="prN" min="1" max="200" step="1" inputmode="numeric"></div>
    <div class="fld"><label><span data-i="rot">Rotación</span> — <span id="rotVal">0°</span></label><input type="range" id="prR" min="0" max="359" step="1" value="0"></div>
    <div id="calcBox"></div>
    <div class="aBtns">
      <button class="aBtn" id="prDup" data-i="dup">Duplicar</button>
      <button class="aBtn" id="prR90" data-i="rot90">Rotar 90°</button>
      <button class="aBtn danger" id="prDel" data-i="del">Eliminar</button>
    </div>
  </aside>
</div>

<!-- ===== Menu ===== -->
<div class="ov" id="menuOv"><div class="card">
  <button class="closeX" data-ov="menuOv">&#10005;</button>
  <h1 data-i="menu">Menú</h1>
  <div class="mList">
    <button id="mSum" data-i="mSum">Resumen del diseño</button>
    <button id="mPng" data-i="mPng">Guardar imagen (PNG)</button>
    <button id="mJson" data-i="mJson">Exportar diseño (JSON)</button>
    <button id="mImp" data-i="mImp">Importar diseño</button>
    <button id="mSet" data-i="mSet">Ajustes</button>
    <button id="mClear" class="danger" data-i="mClear">Borrar todo</button>
    <button id="mBack" data-i="mBack">← Río Grande Guidance</button>
  </div>
</div></div>

<!-- ===== Summary ===== -->
<div class="ov" id="sumOv"><div class="card">
  <button class="closeX" data-ov="sumOv">&#10005;</button>
  <h1 data-i="sumTitle">Resumen del diseño</h1>
  <div class="bigStats" id="sumBig"></div>
  <table class="sum">
    <thead><tr><th data-i="sType">Elemento</th><th data-i="sCount">Cant.</th><th>m²</th></tr></thead>
    <tbody id="sumBody"></tbody>
  </table>
</div></div>

<!-- ===== Settings ===== -->
<div class="ov" id="setOv"><div class="card">
  <button class="closeX" data-ov="setOv">&#10005;</button>
  <h1 data-i="set">Ajustes</h1>
  <div class="fld"><label data-i="sM2">m² por cabeza (corral)</label><input type="number" id="stM2" min="5" max="100" step="1"></div>
  <div class="fld"><label data-i="sTw">Terreno – ancho (m)</label><input type="number" id="stTw" min="100" max="3000" step="50"></div>
  <div class="fld"><label data-i="sTd">Terreno – fondo (m)</label><input type="number" id="stTd" min="100" max="3000" step="50"></div>
  <label class="chk"><input type="checkbox" id="stLab"><span data-i="sLab">Etiquetas</span></label>
  <label class="chk"><input type="checkbox" id="stShad"><span data-i="sShad">Sombras</span></label>
  <div class="mList" style="margin-top:14px"><button id="stApply" data-i="apply">Aplicar</button></div>
</div></div>

<input type="file" id="impFile" accept=".json,application/json" style="display:none">

<script src="three.min.js"></script>
<script>
"use strict";
(function () {

if (typeof THREE === "undefined") {
  var e = document.getElementById("err");
  e.style.display = "flex";
  e.textContent = "No se pudo cargar el motor 3D (three.min.js). Revisá la conexión y recargá. / Could not load the 3D engine — reload with a connection.";
  return;
}

/* ================= Utilities ================= */
const $ = id => document.getElementById(id);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const D2R = Math.PI / 180;

const store = (() => {
  let mem = {}, ok = false;
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); ok = true; } catch (e) {}
  return {
    get(k, d) { try { const v = ok ? localStorage.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { const s = JSON.stringify(v); if (ok) localStorage.setItem(k, s); else mem[k] = s; } catch (e) {} }
  };
})();

function seededRand(seed) {
  let a = seed | 0 || 1;
  return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

  c2.position.set(x + r * 0.4, 2 + r * 1.05, z + r * 0.25); c2.castShadow = true; g.add(c2);
}

/* ================= Item management ================= */
const groups = new Map();

function disposeGroup(g) {
  g.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material && o.material.userData && o.material.userData.own) {
      if (o.material.map) o.material.map.dispose();
      o.material.dispose();
    }
  });
}

function buildItem(it) {
  const old = groups.get(it.id);
  if (old) { itemsRoot.remove(old); disposeGroup(old); }
  const g = BUILDERS[it.t](it);
  g.position.set(it.x, 0, it.z);
  g.rotation.y = -it.r * D2R;
  g.userData.id = it.id;
  const fp = footOf(it);
  const og = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-fp.w / 2 - 0.6, 0.22, -fp.d / 2 - 0.6), new THREE.Vector3(fp.w / 2 + 0.6, 0.22, -fp.d / 2 - 0.6),
    new THREE.Vector3(fp.w / 2 + 0.6, 0.22, fp.d / 2 + 0.6), new THREE.Vector3(-fp.w / 2 - 0.6, 0.22, fp.d / 2 + 0.6)
  ]);
  const ol = new THREE.LineLoop(og, new THREE.LineBasicMaterial({ color: 0xffd35c }));
  ol.name = "selOl"; ol.layers.set(1); ol.visible = (it.id === selId);
  g.add(ol);
  if (TYPES[it.t].lab && state.labels) g.add(textSprite(it.name, TYPES[it.t].ly || 6));
  groups.set(it.id, g);
  itemsRoot.add(g);
  return g;
}

function rebuildAll() {
  for (const [, g] of groups) { itemsRoot.remove(g); disposeGroup(g); }
  groups.clear();
  state.items.forEach(buildItem);
}

function snapV(v) { return state.snap ? Math.round(v) : Math.round(v * 10) / 10; }

function freeSpot(x, z) {
  let n = 0;
  while (n < 40 && state.items.some(o => Math.abs(o.x - x) < 4 && Math.abs(o.z - z) < 4)) { x += 12; if (n % 4 === 3) { x -= 48; z += 12; } n++; }
  return { x: snapV(x), z: snapV(z) };
}

function addItem(type) {
  const def = TYPES[type];
  state.seq[type] = (state.seq[type] || 0) + 1;
  const p = freeSpot(snapV(cam.t.x), snapV(cam.t.z));
  const it = {
    id: Date.now() % 2147483000 + Math.floor(Math.random() * 999),
    t: type,
    name: t(type) + " " + state.seq[type],
    x: p.x, z: p.z, r: 0
  };
  if (def.w != null) it.w = def.w;
  if (def.d != null) it.d = def.d;
  if (def.n != null) it.n = def.n;
  state.items.push(it);
  buildItem(it);
  select(it.id);
  refreshAll();
  save();
  closeSheet("side");
}

function removeItem(id) {
  const g = groups.get(id);
  if (g) { itemsRoot.remove(g); disposeGroup(g); groups.delete(id); }
  state.items = state.items.filter(i => i.id !== id);
  if (selId === id) select(null);
  refreshAll(); save();
}

function itemById(id) { return state.items.find(i => i.id === id); }

function select(id) {
  selId = id;
  for (const [gid, g] of groups) {
    const ol = g.getObjectByName("selOl");
    if (ol) ol.visible = (gid === id);
  }
  const pr = $("props");
  if (id == null) { pr.classList.remove("has", "open"); }
  else { pr.classList.add("has", "open"); fillProps(); }
  refreshList();
}

/* ================= Interaction ================= */
const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const ndc = new THREE.Vector2(), gp = new THREE.Vector3();
const ptrs = new Map();
let mode = null, down = null, dragId = null;
const dragOff = { x: 0, z: 0 };
let pinch0 = null;

function setNdc(x, y) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
}
function groundAt(x, y, out) {
  setNdc(x, y);
  raycaster.setFromCamera(ndc, camera);
  return raycaster.ray.intersectPlane(groundPlane, out);
}
function pickItem(x, y) {
  setNdc(x, y);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(itemsRoot.children, true);
  if (!hits.length) return null;
  let o = hits[0].object;
  while (o.parent && o.parent !== itemsRoot) o = o.parent;
  return o.userData.id != null ? o.userData.id : null;
}

canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) {
    down = { x: e.clientX, y: e.clientY, moved: false };
    const hit = pickItem(e.clientX, e.clientY);
    if (hit != null && e.button !== 2) {
      mode = "obj"; dragId = hit;
      const it = itemById(hit);
      if (groundAt(e.clientX, e.clientY, gp)) { dragOff.x = it.x - gp.x; dragOff.z = it.z - gp.z; }
    } else {
      mode = (e.button === 2) ? "pan" : "orbit";
      dragId = null;
    }
  } else if (ptrs.size === 2) {
    const a = [...ptrs.values()];
    pinch0 = { d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), mx: (a[0].x + a[1].x) / 2, my: (a[0].y + a[1].y) / 2, rho: cam.rho };
    mode = "pinch";
  }
});
canvas.addEventListener("pointermove", e => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) down.moved = true;
  if (mode === "pinch" && ptrs.size === 2) {
    const a = [...ptrs.values()];
    const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    const mx = (a[0].x + a[1].x) / 2, my = (a[0].y + a[1].y) / 2;
    if (d > 10) cam.rho = clamp(pinch0.rho * (pinch0.d / d), 14, 2200);
    panCam(mx - pinch0.mx, my - pinch0.my);
    pinch0.mx = mx; pinch0.my = my; pinch0.d = d; pinch0.rho = cam.rho;
  } else if (mode === "orbit") {
    cam.th -= dx * 0.005;
    cam.ph = clamp(cam.ph - dy * 0.005, 0.06, 1.45);
    camGoal.ph = null;
  } else if (mode === "pan") {
    panCam(dx, dy);
  } else if (mode === "obj" && down && down.moved) {
    if (!ptrs.size || ptrs.size > 1) return;
    const it = itemById(dragId);
    if (it && groundAt(e.clientX, e.clientY, gp)) {
      it.x = snapV(gp.x + dragOff.x);
      it.z = snapV(gp.z + dragOff.z);
      const g = groups.get(dragId);
      if (g) g.position.set(it.x, 0, it.z);
      if (selId === dragId) $("prSub").textContent = fmt(Math.round(it.x)) + ", " + fmt(Math.round(it.z)) + " m";
    }
  }
});
function ptrEnd(e) {
  const wasTap = down && !down.moved && ptrs.size === 1;
  if (wasTap) {
    if (mode === "obj" && dragId != null) select(dragId);
    else if (mode === "orbit") select(null);
  }
  if (mode === "obj" && down && down.moved) save();
  ptrs.delete(e.pointerId);
  if (ptrs.size === 0) { mode = null; down = null; dragId = null; pinch0 = null; }
  else if (ptrs.size === 1) { mode = "orbit"; down = null; }
}
canvas.addEventListener("pointerup", ptrEnd);
canvas.addEventListener("pointercancel", ptrEnd);
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  cam.rho = clamp(cam.rho * Math.exp(e.deltaY * 0.0011), 14, 2200);
}, { passive: false });
canvas.addEventListener("contextmenu", e => e.preventDefault());

window.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  const step = cam.rho * 0.035;
  const fx = -Math.sin(cam.th), fz = -Math.cos(cam.th);
  const rx = Math.cos(cam.th), rz = -Math.sin(cam.th);
  switch (e.key.toLowerCase()) {
    case "w": case "arrowup": cam.t.x += fx * step; cam.t.z += fz * step; break;
    case "s": case "arrowdown": cam.t.x -= fx * step; cam.t.z -= fz * step; break;
    case "a": case "arrowleft": cam.t.x -= rx * step; cam.t.z -= rz * step; break;
    case "d": case "arrowright": cam.t.x += rx * step; cam.t.z += rz * step; break;
    case "q": cam.th += 0.07; break;
    case "e": cam.th -= 0.07; break;
    case "r": if (selId != null) { const it = itemById(selId); it.r = (it.r + 90) % 360; $("prR").value = it.r; propsLock = false; propChanged(); } break;
    case "delete": case "backspace": if (selId != null) { e.preventDefault(); removeItem(selId); } break;
    case "escape": select(null); break;
  }
});

function fmt(n) { return n.toLocaleString(state.lang === "es" ? "es-AR" : "en-US"); }

function stats() {
  let pens = 0, cap = 0, bunk = 0, penArea = 0, used = 0;
  for (const it of state.items) {
    const fp = footOf(it);
    used += fp.w * fp.d;
    if (it.t === "corral") {
      pens++; penArea += it.w * it.d;
      cap += Math.floor((it.w * it.d) / state.m2head);
      bunk += it.w;
    }
  }
  return { pens, cap, bunk, penArea, used };
}

function resize() {
  const r = $("stage").getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(1, r.height);
  camera.updateProjectionMatrix();
}

function render() { applyCam(); renderer.render(scene, camera); }
function loop() {
  if (camGoal.ph != null) {
    cam.ph += (camGoal.ph - cam.ph) * 0.16;
    if (Math.abs(camGoal.ph - cam.ph) < 0.004) { cam.ph = camGoal.ph; camGoal.ph = null; }
  }
  render();
  requestAnimationFrame(loop);
}

$("ckSnap").checked = !!state.snap;
$("gridBtns").querySelectorAll("button").forEach(x => x.classList.toggle("on", parseInt(x.dataset.g) === state.grid));
renderer.shadowMap.enabled = !!state.shadows;

buildTerrain();
rebuildAll();
applyLang();
cam.rho = Math.max(state.terrain.w, state.terrain.d) * 1.05;
resize();
loop();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

})();
</script>
</body>
</html>
